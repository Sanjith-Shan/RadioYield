# First thing to run once both boards are flashed: proves the whole chain at 1 m.
# Expect PER ~0 and RSSI somewhere in the -30s/-40s dBm (not a spec; just "it works").
plan: smoke_wifi_1m
description: WiFi ESP-NOW smoke test, 1 channel, 2 powers, 200 packets
build: EVT1
station: HALL-A
unit_serial: DUT-01
ref_serial: REF-01
radio: wifi
channels: [6]
tx_power_qdbm: [80, 44]
packets_per_step: 200
interval_ms: 5
payload_len: 32
setup:
  mode: OTA
  distance_m: 1.0
  orientation: boards flat on the floor, antennas parallel, facing each other
  obstacles: none (line of sight)
  height_m: 0.0
